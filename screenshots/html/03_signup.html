<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="device">
    <div class="status-bar">
        <span>9:41</span>
        <div class="status-icons">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 20h20"/><path d="M5 20v-4"/><path d="M9 20v-8"/><path d="M13 20V8"/><path d="M17 20V4"/></svg>
            <svg width="22" height="12" viewBox="0 0 24 13" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="1" width="18" height="11" rx="2"/><path d="M22 4.5v4" stroke-linecap="round"/><rect x="3" y="3" width="12" height="7" fill="currentColor"/></svg>
        </div>
    </div>
    <div class="content" style="padding: 24px; justify-content: center;">
        <div style="display: flex; flex-direction: column; align-items: center; margin-bottom: 20px;">
            <div class="logo-glow" style="margin-bottom: 14px;">
                <svg width="44" height="44" viewBox="0 0 96 96" fill="none">
                    <path d="M48 6 L14 18 V46 C14 67 28.5 86.5 48 92 C67.5 86.5 82 67 82 46 V18 Z" fill="url(#vaultGrad)"/>
                    <path d="M48 30 C43.5 30 40 33.5 40 38 C40 41.5 42.2 44.5 45.4 45.5 L43 58 H53 L50.6 45.5 C53.8 44.5 56 41.5 56 38 C56 33.5 52.5 30 48 30 Z" fill="#38BDF8"/>
                    <defs><linearGradient id="vaultGrad" x1="14" y1="6" x2="82" y2="92" gradientUnits="userSpaceOnUse"><stop stop-color="#4F46E5"/><stop offset="1" stop-color="#06B6D4"/></linearGradient></defs>
                </svg>
            </div>
            <h2 style="font-size: 26px; font-weight: 800; color: #F8FAFC; margin-bottom: 6px;">Create Account</h2>
            <p style="font-size: 14px; color: #94A3B8;">Protect your personal data in Privena Vault</p>
        </div>

        <div class="card" style="margin-bottom: 22px;">
            <div style="margin-bottom: 15px;">
                <div class="label">USERNAME</div>
                <div class="input">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <span style="color: #64748B;">Your full name</span>
                </div>
            </div>

            <div style="margin-bottom: 15px;">
                <div class="label">EMAIL ADDRESS</div>
                <div class="input focus">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#38BDF8" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                    <span>alex.dimas@privena.io</span>
                </div>
            </div>

            <div style="margin-bottom: 22px;">
                <div class="label">PASSWORD</div>
                <div class="input">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    <span style="color: #64748B; letter-spacing: 2px;">••••••••••••</span>
                </div>
            </div>

            <button class="btn-primary">Create Account</button>
        </div>

        <div style="display: flex; justify-content: center; align-items: center; gap: 8px;">
            <span style="font-size: 14px; color: #94A3B8;">Already have an account?</span>
            <span style="font-size: 14px; font-weight: 700; color: #38BDF8; cursor: pointer;">Sign In</span>
        </div>
    </div>
    <div class="nav-bar"><div class="nav-pill"></div></div>
</div>
</body>
</html>
